<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="kaizen_ — learning game development">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140a2e"/>
      <stop offset="1" stop-color="#0a0518"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#7c3aed" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, "Courier New", monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- card -->
  <rect x="8" y="8" width="884" height="244" rx="18" fill="url(#bg)" stroke="#4c2a9a" stroke-width="2"/>
  <rect x="8" y="8" width="884" height="244" rx="18" fill="url(#grid)"/>
  <rect x="8" y="8" width="884" height="244" rx="18" fill="url(#glow)"/>

  <!-- window dots -->
  <circle cx="46" cy="42" r="6" fill="#a78bfa"/>
  <circle cx="68" cy="42" r="6" fill="#7c3aed"/>
  <circle cx="90" cy="42" r="6" fill="#4c1d95"/>
  <text x="116" y="46" class="mono" font-size="13" fill="#8b7bb8">kaizen@unity:~$</text>

  <!-- title -->
  <text x="44" y="140" class="mono" font-size="76" font-weight="700" fill="#f3eeff">kaizen<tspan class="cursor" fill="#a78bfa">_</tspan></text>
  <text x="48" y="182" class="mono" font-size="19" fill="#b9a6f0"><tspan fill="#7c3aed">&gt;</tspan> learning game development</text>
  <text x="48" y="210" class="mono" font-size="14" fill="#8b7bb8">one small step at a time</text>

  <!-- low poly crystal (original shape) -->
  <g transform="translate(0,0)">
    <polygon points="760,135 760,65 820,100" fill="#a78bfa"/>
    <polygon points="760,135 820,100 820,170" fill="#7c3aed"/>
    <polygon points="760,135 820,170 760,205" fill="#5b21b6"/>
    <polygon points="760,135 760,205 700,170" fill="#4c1d95"/>
    <polygon points="760,135 700,170 700,100" fill="#6d28d9"/>
    <polygon points="760,135 700,100 760,65" fill="#8b5cf6"/>
    <polygon points="760,65 820,100 820,170 760,205 700,170 700,100" fill="none" stroke="#ddd0ff" stroke-opacity="0.45" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- floating facets -->
  <polygon points="650,70 668,60 676,80" fill="#8b5cf6" fill-opacity="0.8"/>
  <polygon points="856,70 872,84 852,96" fill="#a78bfa" fill-opacity="0.7"/>
  <polygon points="848,196 868,206 850,222" fill="#6d28d9" fill-opacity="0.9"/>
  <polygon points="662,200 676,190 684,206 668,214" fill="#4c1d95"/>
</svg>
