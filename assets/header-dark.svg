<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="kaizen — I build tools, apps and AI assistants">
<defs>
  <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#e2462a"/><stop offset="1" stop-color="#ff8a5c"/></linearGradient>
  <style>
    .s{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .c{animation:b 1.2s steps(1) infinite}@keyframes b{50%{opacity:0}}
  </style>
</defs>
<rect width="1000" height="240" rx="14" fill="#131217"/>
<rect x="0.5" y="0.5" width="999" height="239" rx="13.5" fill="none" stroke="#2a2833"/>
<rect x="56" y="48" width="36" height="4" rx="2" fill="url(#bar)"/>
<text x="54" y="130" class="s" font-size="68" font-weight="650" letter-spacing="-2" fill="#f2f0ec">kaizen<tspan class="c" fill="#e2462a">_</tspan></text>
<text x="56" y="170" class="s" font-size="19" fill="#a19dac">I build tools, apps and AI assistants.</text>
<text x="56" y="200" class="m" font-size="13" fill="#6f6b7a">改善 · change for the better</text>

<g transform="translate(540 36)">
  <rect width="404" height="168" rx="10" fill="#1b1a21" stroke="#2a2833"/>
  <circle cx="20" cy="20" r="5" fill="#ff5f57"/><circle cx="38" cy="20" r="5" fill="#febc2e"/><circle cx="56" cy="20" r="5" fill="#28c840"/>
  <text x="384" y="24" text-anchor="end" class="m" font-size="11" fill="#6f6b7a">kaizen.ts</text>
  <g class="m" font-size="14">
    <text x="22" y="62"><tspan fill="#ff7b72">const</tspan><tspan fill="#f2f0ec"> kaizen </tspan><tspan fill="#8b8798">=</tspan><tspan fill="#f2f0ec"> {</tspan></text>
    <text x="44" y="86"><tspan fill="#79c0ff">langs</tspan><tspan fill="#8b8798">: [</tspan><tspan fill="#7ee787">"Python"</tspan><tspan fill="#8b8798">, </tspan><tspan fill="#7ee787">"C#"</tspan><tspan fill="#8b8798">, </tspan><tspan fill="#7ee787">"TS"</tspan><tspan fill="#8b8798">],</tspan></text>
    <text x="44" y="108"><tspan fill="#79c0ff">now</tspan><tspan fill="#8b8798">:   [</tspan><tspan fill="#7ee787">"Mira"</tspan><tspan fill="#8b8798">, </tspan><tspan fill="#7ee787">"StreakRun"</tspan><tspan fill="#8b8798">],</tspan></text>
    <text x="44" y="130"><tspan fill="#79c0ff">method</tspan><tspan fill="#8b8798">: </tspan><tspan fill="#7ee787">"small steps"</tspan><tspan fill="#8b8798">,</tspan></text>
    <text x="22" y="152"><tspan fill="#f2f0ec">}</tspan><tspan fill="#8b8798">;</tspan></text>
  </g>
</g>
</svg>
